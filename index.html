<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copy Center | ملازم ومحاضرات</title>
<style>
:root{color-scheme:dark;--bg:#070b1a;--card:#0f1730;--tx:#f1f5f9;--mut:#94a3b8;--pri:#6366f1;--pri2:#8b5cf6;--soft:#1b2650;--bd:#1f2a4a;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(600px 420px at 0% 100%,#4c1d9560,transparent),radial-gradient(520px 320px at 100% 0%,#312e8150,transparent),linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed;color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.6;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.15;z-index:0;animation:float 9s ease-in-out infinite}
.b1{width:260px;height:260px;background:var(--pri);top:-60px;right:-60px}
.b2{width:300px;height:300px;background:var(--pri2);bottom:-90px;left:-80px;animation-delay:-4s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.12)}}
.app{position:relative;z-index:1;max-width:560px;margin:auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:18px 16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.back{border:0;background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;box-shadow:0 2px 8px #0001;transition:.2s}
.back:hover{transform:translateX(3px)}.back.off{visibility:hidden}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.cnt{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:14px;min-height:18px}
.stage{flex:1;position:relative}
.page{background:#0f1730cc;border:1px solid var(--bd);border-radius:28px;padding:22px 18px;backdrop-filter:blur(8px);animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.page.back-dir{animation-name:inb}
.page.out{animation:out .25s ease-in both}
@keyframes in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.97)}}
.emoji{font-size:54px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
h1{font-size:28px;line-height:1.3;margin:8px 0}
h2{font-size:22px;margin:4px 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px}
.center{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border:1px solid var(--bd);background:#121b38;color:var(--tx);border-radius:18px;font:inherit;font-weight:600;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;opacity:0;animation:pop .4s ease forwards}
.grid .opt span{font-size:26px;width:58px;height:58px;border-radius:16px;background:var(--soft);border:1px solid #2c3a6e;display:grid;place-items:center;color:#8da2ff;margin-bottom:6px}.hd{display:flex;gap:14px;align-items:center;margin-bottom:20px}.hd h2{margin:0}.hd .sub{margin:2px 0 0}.bdg{width:58px;height:58px;flex:none;border-radius:18px;background:var(--soft);border:1px solid #2c3a6e;display:grid;place-items:center;font-size:26px}
.opt small{font-weight:400;color:var(--mut);font-size:12px}
.opt:hover{transform:translateY(-4px);border-color:var(--pri);box-shadow:0 8px 20px #2563eb22}
.opt:active{transform:scale(.96)}
.opt.on{border-color:var(--pri);background:var(--soft)}
.opt:disabled{opacity:.35!important;cursor:not-allowed;transform:none;box-shadow:none}
.list .opt{flex-direction:row;justify-content:space-between;padding:14px 16px;text-align:right}
.list{display:grid;gap:10px}
.sb{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px 14px;opacity:0;animation:pop .4s ease forwards}.sb b{display:block;margin-bottom:8px}.nums{display:flex;flex-wrap:wrap;gap:8px}.num{flex:1;min-width:46px;padding:10px 0;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,color .2s}.num:hover{transform:translateY(-3px);border-color:var(--pri)}.num:active{transform:scale(.92)}.num.on{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:14px;color:#fff;transition:.2s}
.opt.on .tick{background:var(--pri);border-color:var(--pri)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
input[type=text]{width:100%;padding:16px;border:2px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;font-size:17px;transition:.2s;outline:0}
input[type=text]:focus{border-color:var(--pri);box-shadow:0 0 0 4px #2563eb22}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:18px;text-align:center;text-decoration:none;transition:transform .2s,box-shadow .2s,opacity .2s;box-shadow:0 8px 22px #2563eb40}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.wa{background:#16a34a;box-shadow:0 8px 22px #16a34a40}
.btn.sec{background:var(--soft);color:var(--tx);box-shadow:none}
.note{font-size:13px;color:var(--mut);margin-top:10px}.warn{color:var(--bad)}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:6px 16px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--bd);opacity:0;animation:pop .4s ease forwards}
.sum div:last-child{border:0}.sum span{color:var(--mut)}.sum b{text-align:left}
.check{width:90px;height:90px;margin:10px auto}
.check circle{fill:none;stroke:#16a34a;stroke-width:5;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .7s ease forwards}
.check path{fill:none;stroke:#16a34a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
pre{white-space:pre-wrap;font:inherit;background:var(--card);padding:14px;border-radius:16px;border:1px solid var(--bd);animation:pop .5s .3s ease both}
.code{font-size:44px;font-weight:800;letter-spacing:8px;color:var(--pri);margin:2px 0 6px}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:5;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
footer{text-align:center;color:var(--mut);font-size:12px;padding:16px 0 4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}

.hide{display:none!important}
.lr{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--bd);flex-wrap:wrap}
.sb b+.lr{border-top:0}
.lr .nm{flex:1;font-weight:600;min-width:90px}.lr .pr{color:var(--mut);font-size:13px}
.qt{display:flex;align-items:center;gap:6px}
.qt button{width:36px;height:36px;border-radius:10px;border:0;background:var(--soft);color:var(--tx);font-size:19px;cursor:pointer;transition:transform .15s}
.qt button:active{transform:scale(.88)}.qt b{min-width:22px;text-align:center}
.pvb{border:0;background:transparent;color:#8da2ff;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.tot{position:sticky;bottom:8px;background:var(--card);border:1px solid var(--pri);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;box-shadow:0 8px 24px #0006}
.tot b{color:#8da2ff;font-size:20px}
.pay{display:grid;gap:10px;margin-top:14px}
.pay .opt{flex-direction:row;justify-content:flex-start;gap:12px;text-align:right}
.bill .sg{display:block;padding:8px 0;border-bottom:1px dashed var(--bd)}
.bill .sg b{display:block;margin-bottom:2px;text-align:right}
.bill .ln{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;padding:1px 0}
.bill .ln i{font-style:normal;color:var(--tx)}
.bill .gt{display:flex;justify-content:space-between;padding:12px 0 6px;font-size:18px;font-weight:800}
.modal{position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.mbox{background:var(--card);border-radius:18px;max-width:720px;width:100%;padding:14px}
.mbox img{width:100%;display:block;border-radius:10px;margin-bottom:10px}
.mx{display:block;margin:0 0 10px auto;border:0;background:var(--soft);color:var(--tx);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
.rpv{max-width:100%;max-height:260px;border-radius:12px;margin-top:10px;display:block}
input[type=file]{width:100%;padding:10px;border:1.5px dashed var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.pw{direction:ltr;margin-top:6px;font-size:12px;letter-spacing:.5px;opacity:.85}.pw b{background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="app">
 <div class="top"><button class="back off" id="back" aria-label="رجوع">→</button><div class="logo">Copy Center</div><div style="width:40px"></div></div>
 <div class="bar"><i id="pb"></i></div><div class="cnt" id="cnt"></div>
 <div class="stage" id="stage"></div>
 <footer>مكتبة الكلية — كل محاضراتك في مكان واحد<div class="pw">Powered by <b>Ahmed Ashraf</b></div></footer>
</div>
<div id="pvm" class="modal hide"><div class="mbox"><button class="mx" id="pvx" aria-label="إغلاق">✕</button><div id="pvb"></div></div></div>
<div id="dlg" class="modal hide" style="align-items:center;z-index:40"><div class="mbox" style="max-width:380px;text-align:center;padding:22px"><h3 id="dm" style="margin:0 0 6px;line-height:1.6"></h3><button class="btn" id="dy"></button><button class="btn sec" id="dn">إلغاء</button></div></div>
<script>
const YEARS=[["الفرقة الأولى","①"],["الفرقة الثانية","②"],["الفرقة الثالثة","③"],["الفرقة الرابعة","④"]];
const DIVS=[["أشعة","🩻"],["مختبرات","🔬"],["بصريات","👓"],["أجهزة طبية","🩺"],["أسنان","🦷"],["رعاية تنفسية","💙"]];
const B1="الفرع الأول",B2="الفرع الثاني",B3="الفرع الثالث";
const DB={"أشعة":B2,"مختبرات":B2,"بصريات":B1,"أجهزة طبية":B1,"أسنان":B3,"رعاية تنفسية":B3};
let SUBJ={},LOADED=false,SET={};
const S={name:"",phone:"",year:null,div:null,cart:{},date:null,pay:"cash",code:"",id:"",rdone:false,rimg:""};
let page="welcome",dir="fwd";
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const curKey=()=>S.year===0?"عام":S.div+"|"+(S.year+1);
const subjList=()=>SUBJ[curKey()];
const lecs=s=>s.lec||Array.from({length:s.c||0},()=>({p:0,pv:false}));
const pid=(si,n)=>curKey().replace("|","_")+"~"+subjList()[si].n+"~"+n;
const branch=()=>S.year===0?B3:(S.div?DB[S.div]:null);
const items=()=>Object.values(S.cart).filter(x=>x.q>0);
const total=()=>items().reduce((a,x)=>a+x.q*x.p,0);
function grouped(){const m={};items().forEach(x=>{(m[x.s]=m[x.s]||[]).push(x)});Object.values(m).forEach(a=>a.sort((u,v)=>u.n-v.n));return m}
const billHtml=()=>Object.entries(grouped()).map(([s,a])=>`<div class="sg"><b>${esc(s)}</b>${a.map(x=>`<div class="ln"><span>محاضرة ${x.n} × ${x.q}</span><i>${x.q*x.p} ج</i></div>`).join("")}</div>`).join("")+`<div class="gt"><span>الإجمالي</span><span>${total()} ج</span></div>`;
window.setSubjects=o=>{SUBJ=o;LOADED=true;if(page==="subs")render()};
window.setSettings=o=>{SET=o||{};if(page==="sum")render()};
const okw=()=>S.name.trim().length>2&&/^01\d{9}$/.test(S.phone);
function order(){const o=["welcome","year"];if(S.year!==0)o.push("div");if(S.year===0||S.div)o.push("subs");o.push("date","sum");return o}
function go(p,d){dir=d||"fwd";const st=$("stage"),cur=st.firstChild;const swap=()=>{page=p;render()};if(cur){cur.classList.add("out");setTimeout(swap,230)}else swap()}
function next(){const o=order();go(o[o.indexOf(page)+1])}
function prev(){const o=order();const i=o.indexOf(page);if(i>0)go(o[i-1],"back")}
$("back").onclick=prev;
function days(){const n=new Date(),a=[];for(let i=0;i<7;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i),e=new Date(d);e.setHours(10,0,0,0);const fri=d.getDay()===5,open=!fri&&n<e;a.push({label:d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"}),short:d.toLocaleDateString("ar-EG",{weekday:"long"}),num:d.toLocaleDateString("ar-EG",{day:"numeric",month:"long"}),today:i===0,open,when:fri?"الجمعة إجازة":open?"الحجز مفتوح ✓":"الحجز اتقفل",iso:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})}return a}
function head(e,t,s){return `<div class="hd"><div class="bdg">${e}</div><div><h2>${t}</h2><p class="sub">${s}</p></div></div>`}
function delay(i){return `style="animation-delay:${.06*i+.1}s"`}
function bar(){const o=order(),i=o.indexOf(page),n=o.length-1;const p=page==="done"?100:Math.round(i/n*100);$("cnt").innerHTML=page==="done"?"<span>تم الحجز ✓</span><span>100%</span>":`<span>${p?`خطوة ${i} من ${n}`:"لسه هنبدأ"}</span><span>${p}%</span>`;$("pb").style.width=p+"%";$("back").classList.toggle("off",page==="welcome"||page==="done")}
function rowsHtml(rows){return rows.map((r,i)=>`<div ${delay(i)}><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join("")}
const infoRows=()=>[["الاسم",S.name],["الموبايل",S.phone],["الفرقة",YEARS[S.year][0]],["الشعبة",S.year===0?"عام":S.div],["موعد الاستلام",S.date.label],["فرع الاستلام",branch()]];
function render(){
 const st=$("stage");let h="";
 if(page==="welcome"){
  h=`<div class="center" style="padding-top:20px"><div class="emoji" style="font-size:80px">📚</div><h1>مذاكرتك تبدأ من<br>الاختيار الصح</h1><p class="sub">احجز ملازمك ومحاضراتك في خطوات بسيطة واستلمها من الفرع الأقرب ليك.</p></div>
  <input type="text" id="nm" placeholder="اكتب اسمك الثلاثي" value="${esc(S.name)}" autocomplete="name"><input type="text" id="ph" inputmode="numeric" maxlength="11" placeholder="رقم الموبايل (01xxxxxxxxx)" value="${esc(S.phone)}" autocomplete="tel" style="margin-top:10px"><button class="btn" id="nx" ${okw()?"":"disabled"}>ابدأ الحجز ←</button>
  <p class="note center">كلية تكنولوجيا العلوم الصحية التطبيقية</p>`;
 }else if(page==="year"){
  h=head("🎒","اختار الفرقة الدراسية","حدد فرقتك عشان نجهزلك المحتوى المناسب")+`<div class="grid">${YEARS.map((y,i)=>`<button class="opt ${S.year===i?"on":""}" data-y="${i}" ${delay(i)}><span>${y[1]}</span>${y[0]}</button>`).join("")}</div>`;
 }else if(page==="div"){
  h=head("🧭","اختار الشعبة","الاستلام بيتحدد حسب شعبتك")+`<div class="grid">${DIVS.map((d,i)=>`<button class="opt ${S.div===d[0]?"on":""}" data-d="${d[0]}" ${delay(i)}><span>${d[1]}</span>${d[0]}</button>`).join("")}</div>`;
 }else if(page==="subs"){
  const l=subjList();
  const body=!LOADED?`<div class="sum" style="padding:24px;text-align:center">⏳ جاري تحميل المواد...</div>`:(l&&l.length?`<div class="list">${l.map((s,si)=>{const L=lecs(s);return `<div class="sb" ${delay(si)}><b>${esc(s.n)}</b>${L.length?L.map((x,k)=>{const n=k+1,q=(S.cart[s.n+"|"+n]||{}).q||0;return `<div class="lr"><span class="nm">محاضرة ${n}</span>${x.pv?`<button class="pvb" data-a="pv" data-si="${si}" data-n="${n}">👁 معاينة</button>`:""}${x.p>0?`<span class="pr">${x.p} ج</span><div class="qt"><button data-a="dec" data-si="${si}" data-n="${n}">−</button><b id="q-${si}-${n}">${q}</b><button data-a="inc" data-si="${si}" data-n="${n}">+</button></div>`:`<span class="pr">السعر لسه ما اتحددش</span>`}</div>`}).join(""):`<div class="note">لسه مفيش محاضرات نازلة</div>`}</div>`}).join("")}</div><div class="tot"><span>الإجمالي</span><b id="tt">${total()} ج</b></div><button class="btn" id="nx" ${items().length?"":"disabled"}>التالي ←</button>`:`<div class="sum" style="padding:24px;text-align:center">⏳ مواد الفرقة/الشعبة دي هتتضاف قريبًا.</div>`);
  h=head("📖","اختار المحاضرات","حدد عدد النسخ لكل محاضرة، وتقدر تعاين قبل ما تحجز")+body;
 }else if(page==="date"){
  h=head("📅","موعد الاستلام","اختار اليوم اللي هتستلم فيه")+`<div class="list">${days().map((d,i)=>`<button class="opt ${S.date&&S.date.label===d.label?"on":""}" data-i="${i}" ${d.open?"":"disabled"} ${delay(i)}><span style="font-size:15px">${d.today?"النهارده — ":""}${d.short}<br><small>${d.num}</small></span><small>${d.when}</small></button>`).join("")}</div><p class="note">الحجز لأي يوم بيقفل الساعة ١٠ صباحًا يوم الاستلام نفسه، ويوم الجمعة إجازة.</p><button class="btn" id="nx" ${S.date?"":"disabled"}>مراجعة الحجز ←</button>`;
 }else if(page==="sum"){
  if(S.pay==="insta"&&!SET.instapay)S.pay="cash";
  h=head("🧾","راجع حجزك والحساب","اتأكد من البيانات وطريقة الدفع")+`<div class="sum">${rowsHtml(infoRows())}</div><div class="sum bill" style="margin-top:12px">${billHtml()}</div>
  <div class="pay"><button class="opt ${S.pay==="cash"?"on":""}" data-p="cash">💵 دفع عند الاستلام</button>${SET.instapay?`<button class="opt ${S.pay==="insta"?"on":""}" data-p="insta">📲 دفع انستا باي (وارفع صورة الوصل)</button>`:""}</div>
  <p class="note warn" id="err"></p><button class="btn" id="ok">تأكيد الحجز ✓</button>`;
 }else if(page==="done"){
  const ins=S.pay==="insta";
  const pay=!ins?`<div class="sum" style="padding:16px;margin-top:12px;text-align:center"><b>💵 ادفع ${total()} ج عند الاستلام</b><p class="note">من ${esc(branch())}</p></div>`
   :S.rdone?`<div class="sum" style="padding:16px;margin-top:12px;text-align:center"><b>✅ تم استلام الوصل</b><p class="note">هنراجع الدفع ونجهز طلبك.</p></div>`
   :`<div class="sum" style="padding:16px;margin-top:12px"><b>📲 حوّل ${total()} ج على انستا باي</b><p class="note" style="color:var(--tx);font-weight:700;direction:ltr;text-align:right">${esc(SET.instapay||"")}</p>${SET.iname?`<p class="note">اسم الحساب: ${esc(SET.iname)}</p>`:""}${SET.inote?`<p class="note">${esc(SET.inote)}</p>`:""}<p class="note">بعد التحويل ارفع صورة الوصل هنا:</p><input type="file" id="rf" accept="image/*"><img id="rp" class="rpv hide"><p class="note warn" id="rerr"></p><button class="btn" id="rs" disabled>رفع الوصل</button></div>`;

function img2data(file,w0=900,q0=.6){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=w0,q=q0,u;for(let t=0;t<4;t++){const k=Math.min(1,w/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);u=c.toDataURL("image/jpeg",q);if(u.length<650000)break;w*=.8;q-=.1}res(u)};im.src=r.result};r.readAsDataURL(file)})}

function payload(){return{name:S.name.trim(),phone:S.phone,year:S.year+1,yearLabel:YEARS[S.year][0],div:S.year===0?"عام":S.div,branch:branch(),dateLabel:S.date.label,dateISO:S.date.iso,pay:S.pay,total:total(),items:Object.entries(grouped()).map(([s,a])=>({name:s,lec:a.map(x=>({n:x.n,q:x.q,p:x.p}))}))}}

 const q=s=>document.querySelectorAll(s),nx=$("nx");

 if($("rf")){$("rf").onchange=async()=>{const f=$("rf").files[0];$("rerr").textContent="";if(!f)return;try{S.rimg=await img2data(f);$("rp").src=S.rimg;$("rp").classList.remove("hide");$("rs").disabled=false}catch(e){$("rerr").textContent="مقدرتش أقرأ الصورة، جرب صورة تانية."}};
  $("rs").onclick=async()=>{const b=$("rs");b.disabled=true;b.textContent="جاري الرفع...";try{await window.FB.receipt(S.id,S.rimg);S.rdone=true;S.rimg="";clearPending();render()}catch(e){$("rerr").textContent="حصلت مشكلة في رفع الوصل، جرب تاني.";b.disabled=false;b.textContent="رفع الوصل"}}}
 if($("again"))$("again").onclick=async()=>{if(S.pay==="insta"&&!S.rdone&&S.id&&!await ask("لسه ما رفعتش الوصل. متأكد إنك عايز تبدأ حجز جديد؟","أيوه، حجز جديد"))return;clearPending();S.year=S.div=S.date=null;S.cart={};S.id="";S.rdone=false;S.pay="cash";go("welcome","back")};
}
try{const p=JSON.parse(localStorage.getItem("ccPending")||"null");if(p&&p.id&&p.year!=null&&!p.rdone&&p.date){Object.assign(S,p);page="done"}}catch(e){}
render();
</script>
